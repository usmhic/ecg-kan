name: Repository checks

on: [push, pull_request]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python research/build_paper_tables.py --check
      - run: python research/audit_artifacts.py

  manuscript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y texlive-latex-extra texlive-fonts-recommended texlive-publishers
      - run: pdflatex -halt-on-error -interaction=nonstopmode main.tex
        working-directory: paper
      - run: pdflatex -halt-on-error -interaction=nonstopmode main.tex
        working-directory: paper
